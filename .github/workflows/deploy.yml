# Deploys CareBridge to Cloudflare every time code lands on the main branch (and only then).
# It always builds from a fresh copy of main on GitHub, never from anyone's own computer.
# One-time setup: in GitHub -> Settings -> Secrets and variables -> Actions, add
#   CLOUDFLARE_API_TOKEN   (a Cloudflare API token that can edit Workers and Pages)
#   CLOUDFLARE_ACCOUNT_ID  (your Cloudflare account id)
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you press "Run workflow" by hand (it still uses main)

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # extra safety: even if started by hand on another branch, do nothing unless it is main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client and server packages
        run: |
          pnpm --dir client install --frozen-lockfile
          pnpm --dir server install --frozen-lockfile
      - name: Run the unit tests (a failing test stops the deploy)
        run: pnpm --dir client test:unit --run
      - name: Build the website and the API copy
        run: node cloudflare/build.mjs
      - name: Deploy the API worker
        working-directory: server
        run: npx wrangler deploy -c wrangler.cloudflare.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the website
        working-directory: cloudflare/pages
        run: npx wrangler pages deploy site --project-name carebridge-wad2g4 --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
