# The CareBridge API on Cloudflare. It has no public address of its own: the website's front door (cloudflare/pages)
# passes /api requests to it. Set the database once with:  npx wrangler secret put DB   (run from this folder)
name = "carebridge-api"
main = ".cf/worker.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Use Mongoose's normal Node build, not its browser build.
[alias]
mongoose = "./node_modules/mongoose/index.js"
